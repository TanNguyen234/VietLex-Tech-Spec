name: Vietlex Legal RAG CI/CD

# Kích hoạt pipeline khi có người push code hoặc pull request vào nhánh main
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- PHASE 1: CONTINUOUS INTEGRATION (CI) ---
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Bước 1: Kéo code từ repo về máy ảo của GitHub
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Bước 2: Cài Python theo contract trong pyproject.toml
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Cache lại thư viện để lần sau build nhanh hơn
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # Bước 3: Cài đặt dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.21 pytest==9.1.1 pytest-asyncio==1.4.0
          pip install -r requirements.txt
          python -c "from pypdf import PdfReader, PdfWriter; import app"

      # Bước 4: Kiểm tra format code (Linting) bằng Ruff
      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Guard repository artifacts
        run: |
          python scripts/check_repository_artifacts.py

      # Bước 5: Chạy Unit Test
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests -q -m "not live" --durations=20 --junitxml=output/ci-tests.xml

      - name: Upload test timings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: output/ci-tests.xml
          if-no-files-found: ignore

  # --- PHASE 2: CONTINUOUS DEPLOYMENT (CD) ---
  build-and-push:
    # Chỉ chạy job này nếu job test-and-lint thành công
    needs: test-and-lint 
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 1: Đăng nhập vào Docker Hub bằng Secret Key
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bước 2: Build Image và Push lên Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: foxy0505/vietlex-rag:latest 
