[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vietlex-online-ssr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.100.0",
    "google-genai>=1.74.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "itsdangerous>=2.1.2",
    "jinja2>=3.1.2",
    "logfire[fastapi]",
    "motor>=3.6.0,<4.0",
    "pinecone>=9.0.0,<10.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pypdf>=6.10.0,<7.0",
    "qdrant-client>=1.18.0,<2.0",
    "requests>=2.32.0,<3.0",
    "slowapi>=0.1.8",
    "truststore>=0.10.4",
    "zstandard>=0.23.0",
    "uvicorn>=0.22.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/**/*", "data/*.json"]
