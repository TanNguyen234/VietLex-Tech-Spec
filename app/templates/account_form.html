<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản · VietLex</title><link rel="stylesheet" href="/static/css/vietlex.css"><link rel="stylesheet" href="/static/css/vietlex-enhancements.css"></head>
<body><main class="account-page"><a class="brand" href="/">VietLex</a><section class="welcome-card">
{% if mode == "register" %}<h1>Đăng ký</h1><form method="post" action="/register"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Mật khẩu<input type="password" name="password" minlength="10" maxlength="256" required autocomplete="new-password"></label><button class="button button-primary" type="submit">Tạo tài khoản</button></form><p><a href="/login">Đã có tài khoản?</a></p>
{% elif mode == "login" %}<h1>Đăng nhập</h1><form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Mật khẩu<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">Đăng nhập</button></form><p><a href="/forgot-password">Quên mật khẩu?</a> · <a href="/register">Đăng ký</a></p>
{% elif mode == "forgot" %}<h1>Khôi phục mật khẩu</h1><form method="post" action="/forgot-password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email<input type="email" name="email" required autocomplete="email"></label><button class="button button-primary" type="submit">Gửi hướng dẫn</button></form>
{% elif mode == "reset" %}<h1>Đặt lại mật khẩu</h1><form method="post" action="/reset-password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><label>Mật khẩu mới<input type="password" name="password" minlength="10" maxlength="256" required autocomplete="new-password"></label><button class="button button-primary" type="submit">Cập nhật mật khẩu</button></form>
{% endif %}
{% if message %}<p role="status">{{ message }}</p>{% endif %}
</section></main></body></html>
