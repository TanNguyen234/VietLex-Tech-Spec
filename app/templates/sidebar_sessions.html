{% for session in sessions %}
<article class="session-item">
  <button type="button" class="session-select" data-action="select-session" data-session-id="{{ session.session_id }}"><span>{{ session.title }}</span></button>
  <div class="session-tools" aria-label="Thao tác hội thoại">
    <a href="/sessions/{{ session.session_id }}/export" title="Xuất Markdown" aria-label="Xuất {{ session.title }}">↓</a>
    <button type="button" data-action="rename-session" data-session-id="{{ session.session_id }}" data-title="{{ session.title }}" title="Đổi tên" aria-label="Đổi tên {{ session.title }}">✎</button>
    <button type="button" data-action="delete-session" data-session-id="{{ session.session_id }}" title="Xóa" aria-label="Xóa {{ session.title }}">×</button>
  </div>
</article>
{% else %}<p class="muted">Chưa có hội thoại phù hợp.</p>{% endfor %}
