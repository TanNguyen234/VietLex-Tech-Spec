<div class="table-wrap"><table class="admin-table"><thead><tr><th>Thời gian</th><th>Quản trị viên</th><th>Hành động</th><th>Đối tượng</th><th>Request</th></tr></thead><tbody>{% for item in audit_logs %}<tr><td>{{ item.timestamp }}</td><td>{{ item.administrator_user_id }}</td><td>{{ item.action }}</td><td>{{ item.target_type }}:{{ item.target_id }}</td><td>{{ item.request_id or 'N/A' }}</td></tr>{% else %}<tr><td colspan="5">Chưa có audit log.</td></tr>{% endfor %}</tbody></table></div>
