model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
service_tier = "default"

[sandbox_workspace_write]
network_access = false

[mcp_servers.crg]
enabled = true
required = false
enabled_tools = ["get_minimal_context_tool", "build_or_update_graph_tool", "detect_changes_tool", "query_graph_tool", "semantic_search_nodes_tool", "list_graph_stats_tool"]
default_tools_approval_mode = "auto"

[mcp_servers.context7]
enabled = true
required = false
enabled_tools = ["resolve-library-id", "query-docs"]
default_tools_approval_mode = "auto"

[mcp_servers.scrapling]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."codex-research-automation@personal"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true
